<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Stackly Grocery</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/webp"
      href="./assets/images/stackly-logo.webp"
    />
    <!-- Custom Project Stylesheet -->
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <!-- 404 Specific Stylesheet -->
    <link rel="stylesheet" href="./assets/css/404.css" />
    <!-- Reusable Web Components (Header & Footer) -->
    <script src="./assets/js/script.js" defer></script>
  </head>
  <body style="display: flex; flex-direction: column; min-height: 100vh">
    <!-- Reusable Custom Header Component -->
    <custom-header></custom-header>

    <!-- Main Content Area -->
    <main class="error-page-wrapper flex-grow-1 d-flex align-items-center">
      <!-- Background Decorative Circles -->
      <div class="error-bg-ellipse-1"></div>
      <div class="error-bg-ellipse-2"></div>

      <!-- Floating Leaves Layer -->
      <div class="floating-leaves-container">
        <div class="error-leaf-wrapper error-leaf-1">
          <img
            src="./assets/images/home/leaves.webp"
            alt="Floating Green Leaf"
            class="error-leaf-img"
          />
        </div>
        <div class="error-leaf-wrapper error-leaf-2">
          <img
            src="./assets/images/home/leaves.webp"
            alt="Floating Green Leaf"
            class="error-leaf-img"
          />
        </div>
        <div class="error-leaf-wrapper error-leaf-3">
          <img
            src="./assets/images/home/leaves.webp"
            alt="Floating Green Leaf"
            class="error-leaf-img"
          />
        </div>
        <div class="error-leaf-wrapper error-leaf-4">
          <img
            src="./assets/images/home/leaves.webp"
            alt="Floating Green Leaf"
            class="error-leaf-img"
          />
        </div>
        <div class="error-leaf-wrapper error-leaf-5">
          <img
            src="./assets/images/home/leaves.webp"
            alt="Floating Green Leaf"
            class="error-leaf-img"
          />
        </div>
      </div>

      <div class="container">
        <div class="row error-content-row align-items-center">
          <!-- Left: 404 Grocery Basket graphic & Text description -->
          <div class="col-lg-7 col-md-6">
            <div class="error-main-illustration-box">
              <img
                src="./assets/images/404/404_grocery_number.webp"
                alt="404 Grocery Basket"
                class="error-number-img"
              />
            </div>
            <div class="error-text-container">
              <h1 class="error-title">
                Look like You have picked <br />
                <span class="wrong-aisle">a wrong aisle!</span>
              </h1>
              <p class="error-desc">
                The page you are looking for might have been moved, deleted or
                out of stock!
              </p>
            </div>
          </div>

          <!-- Right: Speech bubble and Cart character illustration -->
          <div class="col-lg-5 col-md-6">
            <div class="error-cart-illustration-box">
              <!-- Speech Bubble pointing to the cart -->
              <div class="speech-bubble-wrapper">
                <img
                  src="./assets/images/404/this_item_isnt_here_yet.webp"
                  alt="This item isn't here... YET!"
                  class="speech-bubble-img"
                />
              </div>
              <!-- Shopping Cart character -->
              <div class="cart-character-wrapper" id="cart-character">
                <img
                  src="./assets/images/404/cart_character.webp"
                  alt="Sad Shopping Cart Character"
                  class="cart-character-img"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Center: Back to Home Button -->
        <div class="error-cta-box">
          <a href="./index.html" class="btn-back-home">Back to Home</a>
        </div>
      </div>
    </main>

    <!-- Bottom Newsletter Section -->
    <section class="footer-features-newsletter-section">
      <div class="container">
        <div class="newsletter-banner-card">
          <div class="row align-items-center">
            <div class="col-lg-7 col-md-8 position-relative z-3">
              <h3 class="newsletter-title">Subscribe to our Newsletter</h3>
              <p class="newsletter-subtitle">
                Get the best offers & updates straight to your inbox.
              </p>
              <form
                class="newsletter-form d-flex gap-2"
                id="home-newsletter-form"
              >
                <input
                  type="email"
                  class="form-control newsletter-input"
                  placeholder="Enter your email address"
                  required
                />
                <button type="submit" class="btn btn-subscribe">
                  Subscribe
                </button>
              </form>
              <div class="newsletter-success-msg" id="newsletter-success-msg">
                <i class="fa-solid fa-circle-check"></i> Thank you for
                subscribing! Check your inbox for exclusive updates.
              </div>
            </div>
          </div>
          <!-- Newsletter Visuals (Right aligned, overlapping) -->
          <div class="newsletter-visuals-container">
            <img
              src="./assets/images/home/leaves.webp"
              alt="Floating Leaves background"
              class="newsletter-leaves-bg"
            />
            <img
              src="./assets/images/newsletter-image.webp"
              alt="Fresh Groceries Bag"
              class="newsletter-bag-img"
            />
          </div>
        </div>
      </div>
    </section>

    <!-- Reusable Custom Footer Component -->
    <custom-footer></custom-footer>

    <!-- Bootstrap 5 JavaScript Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
