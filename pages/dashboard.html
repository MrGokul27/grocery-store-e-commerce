<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Stackly Grocery</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/webp"
      href="../assets/images/stackly-logo.webp"
    />
    <!-- Main CSS -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <!-- Dashboard Custom CSS -->
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
    <!-- Web Components Script -->
    <script src="../assets/js/script.js" defer></script>
  </head>
  <body class="dashboard-body">
    <!-- Main Dashboard Container -->
    <div class="dashboard-wrapper">
      <!-- Sidebar Panel (Dynamically Populated) -->
      <aside class="dashboard-sidebar" id="dashboard-sidebar">
        <!-- Sidebar Content will be loaded dynamically via Javascript -->
      </aside>

      <!-- Main Dashboard Content Area -->
      <main class="dashboard-main">
        <!-- Mobile Sidebar Toggle -->
        <button class="mobile-sidebar-toggle" id="mobile-sidebar-toggle-btn">
          <i class="fa-solid fa-bars"></i>
          <span>Dashboard Menu</span>
        </button>

        <!-- Dynamic Header -->
        <div class="dashboard-header">
          <h2 class="dashboard-title" id="dashboard-title-text">
            Welcome Back!
          </h2>
          <p class="dashboard-subtitle" id="dashboard-subtitle-text">
            Here's what's happening today in your Stackly account.
          </p>
        </div>

        <!-- Dynamic Content Panels Container -->
        <div id="dashboard-content-panels">
          <!-- Dynamic panels loaded by script -->
        </div>
      </main>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dashboard Core Integration Logic -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Load data from LocalStorage
        let userRole = localStorage.getItem("userRole");
        let userEmail = localStorage.getItem("userEmail");
        let userPassword = localStorage.getItem("userPassword");
        let rememberMe = localStorage.getItem("rememberMe") === "true";
        let userLoggedIn = localStorage.getItem("userLoggedIn") === "true";

        // Prepopulate mock data if not logged in directly for previewing purposes
        if (!userLoggedIn) {
          userRole = "customer"; // Default fallback
          userEmail = "guest.shopper@stacklygrocery.com";
          userPassword = "MockUser1234!";
          rememberMe = true;
          userLoggedIn = true;
          // Store so they persist during interaction
          localStorage.setItem("userRole", userRole);
          localStorage.setItem("userEmail", userEmail);
          localStorage.setItem("userPassword", userPassword);
          localStorage.setItem("rememberMe", rememberMe);
          localStorage.setItem("userLoggedIn", "true");
        }

        // DOM elements
        const sidebar = document.getElementById("dashboard-sidebar");
        const panelsContainer = document.getElementById(
          "dashboard-content-panels",
        );
        const dashboardTitle = document.getElementById("dashboard-title-text");
        const dashboardSubtitle = document.getElementById(
          "dashboard-subtitle-text",
        );

        // Format role text
        const getRoleDisplayName = (role) => {
          if (role === "customer") return "Customer";
          if (role === "manager") return "Store Manager";
          if (role === "delivery") return "Delivery Partner";
          return "Guest User";
        };

        // Render dynamic Sidebar based on Role
        const renderSidebar = () => {
          let roleBadgeClass = "";
          if (userRole === "customer") roleBadgeClass = "role-customer-badge";
          else if (userRole === "manager")
            roleBadgeClass = "role-manager-badge";
          else if (userRole === "delivery")
            roleBadgeClass = "role-delivery-badge";

          let menuHTML = "";
          if (userRole === "customer") {
            menuHTML = `
              <li class="sidebar-menu-item active" data-tab="overview">
                <span class="sidebar-menu-link"><i class="fa-solid fa-gauge"></i>Overview</span>
              </li>
              <li class="sidebar-menu-item" data-tab="orders">
                <span class="sidebar-menu-link"><i class="fa-solid fa-bag-shopping"></i>My Orders</span>
              </li>
              <li class="sidebar-menu-item" data-tab="tracking">
                <span class="sidebar-menu-link"><i class="fa-solid fa-truck-ramp-box"></i>Track Shipment</span>
              </li>
              <li class="sidebar-menu-item" data-tab="addresses">
                <span class="sidebar-menu-link"><i class="fa-solid fa-location-dot"></i>Saved Addresses</span>
              </li>
              <li class="sidebar-menu-item" data-tab="profile">
                <span class="sidebar-menu-link"><i class="fa-solid fa-user-gear"></i>My Profile Info</span>
              </li>
            `;
          } else if (userRole === "manager") {
            menuHTML = `
              <li class="sidebar-menu-item active" data-tab="overview">
                <span class="sidebar-menu-link"><i class="fa-solid fa-chart-line"></i>Overview</span>
              </li>
              <li class="sidebar-menu-item" data-tab="inventory">
                <span class="sidebar-menu-link"><i class="fa-solid fa-boxes-stacked"></i>Inventory Manager</span>
              </li>
              <li class="sidebar-menu-item" data-tab="orders">
                <span class="sidebar-menu-link"><i class="fa-solid fa-clipboard-list"></i>Incoming Orders</span>
              </li>
              <li class="sidebar-menu-item" data-tab="analytics">
                <span class="sidebar-menu-link"><i class="fa-solid fa-chart-pie"></i>Reports & Analytics</span>
              </li>
              <li class="sidebar-menu-item" data-tab="profile">
                <span class="sidebar-menu-link"><i class="fa-solid fa-user-tie"></i>Manager Profile Info</span>
              </li>
            `;

                <span class="sidebar-menu-link"><i class="fa-solid fa-motorcycle"></i>Overview</span>
              </li>
              <li class="sidebar-menu-item" data-tab="jobs">
                <span class="sidebar-menu-link"><i class="fa-solid fa-map-location-dot"></i>Assigned Jobs</span>
              </li>
              <li class="sidebar-menu-item" data-tab="earnings">

              </li>
              <li class="sidebar-menu-item" data-tab="profile">

            <ul class="sidebar-menu">

                        <input type="text" class="form-control" id="profile-name-input" name="profile-name" value="${storedName}" placeholder="Enter your full name" required>

                      <div class="col-md-6 mb-3">

                        <div class="input-group">

                      </div>
                    </div>

                    <div class="mt-4 border-top pt-3 text-end">
                      <button type="submit" class="btn btn-success" id="btn-save-profile">Save Dashboard Custom Settings</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          `;

                        <h5 class="dashboard-card-title"><i class="fa-solid fa-basket-shopping text-success"></i> Weekly Grocery Cart</h5>

                      <div class="dashboard-card-body">
                        <ul class="list-group list-group-flush">

        // Initialize elements
        renderSidebar();
        renderPanels();

        // Mobile Sidebar Toggling functionality
        const mobileToggleBtn = document.getElementById(
          "mobile-sidebar-toggle-btn",
        );
        const dashboardSidebarEl = document.getElementById("dashboard-sidebar");

        if (mobileToggleBtn && dashboardSidebarEl) {
          mobileToggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            dashboardSidebarEl.classList.toggle("show");
          });

          // Close sidebar if clicked outside of it on mobile
          document.addEventListener("click", (e) => {
            if (window.innerWidth <= 992) {
              if (
                !dashboardSidebarEl.contains(e.target) &&
                e.target !== mobileToggleBtn
              ) {
                dashboardSidebarEl.classList.remove("show");
              }
            }
          });
        }

        // Handle tab switches in Dashboard
        const setupTabHandlers = () => {
          const listItems = document.querySelectorAll(".sidebar-menu-item");
          const panels = document.querySelectorAll(".tab-panel");

          listItems.forEach((item) => {
            item.addEventListener("click", () => {
              // Clear active on list items
              listItems.forEach((li) => li.classList.remove("active"));
              // Set active class on clicked item
              item.classList.add("active");

              // Hide all tab panels
              panels.forEach((p) => p.classList.remove("active"));

              // Retrieve tab target name
              const targetTab = item.getAttribute("data-tab");
              const activePanel = document.getElementById(`panel-${targetTab}`);
              if (activePanel) {
                activePanel.classList.add("active");

                // Update text header
                if (targetTab === "overview") {
                  dashboardTitle.textContent = "Welcome Back!";
                  dashboardSubtitle.textContent =
                    "Here's what's happening today in your Stackly account.";
                } else if (targetTab === "profile") {
                  dashboardTitle.textContent = "Credential Information Record";
                  dashboardSubtitle.textContent =
                    "Direct access to local authentication details.";
                } else {
                  dashboardTitle.textContent = item
                    .querySelector("span")
                    .textContent.trim();
                  dashboardSubtitle.textContent = `Managing your ${item.querySelector("span").textContent.toLowerCase()} details.`;
                }
              }

              // Close sidebar on mobile after selecting
              if (window.innerWidth <= 992) {
                dashboardSidebarEl.classList.remove("show");
              }
            });
          });

          // Track Item button trigger mapping to Tracking Tab
          const trackingTriggers = document.querySelectorAll(
            ".tracking-tab-trigger",
          );
          trackingTriggers.forEach((trigger) => {
            trigger.addEventListener("click", (e) => {
              e.preventDefault();
              const trackingSidebarTab = document.querySelector(
                '[data-tab="tracking"]',
              );
              if (trackingSidebarTab) trackingSidebarTab.click();
            });
          });
        };

        setupTabHandlers();

        // Password Show/Hide Toggle logic on Profile page
        const setupPasswordToggler = () => {
          const passToggle = document.getElementById("profile-pass-toggle");
          const passInput = document.getElementById("profile-pass-input");
          const passIcon = document.getElementById("profile-pass-icon");

          if (passToggle && passInput && passIcon) {
            passToggle.addEventListener("click", () => {
              if (passInput.type === "password") {
                passInput.type = "text";
                passIcon.className = "fa-solid fa-eye-slash";
              } else {
                passInput.type = "password";
                passIcon.className = "fa-solid fa-eye";
              }
            });
          }
        };

        // Trigger listener initialization
        setupPasswordToggler();

        // Profile Settings Form validation and redirection handler
        const setupProfileFormHandler = () => {
          // Since the profile form is generated dynamically, we can listen for submit events on the document
          document.addEventListener("submit", (e) => {
            if (e.target && e.target.id === "dashboard-profile-form") {
              e.preventDefault();
              const form = e.target;
              form.classList.add("was-validated");

              if (!form.checkValidity()) {
                return;
              }

              const saveBtn = document.getElementById("btn-save-profile");
              if (saveBtn) {
                saveBtn.disabled = true;
                saveBtn.innerHTML =
                  '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
              }

              setTimeout(() => {
                window.location.href = "../404.html";
              }, 1000);
            }
          });
        };

        // Initialize profile form handler
        setupProfileFormHandler();

        // =========================================================================
        // REDIRECT TO 404 FOR EMPTY LINKS AND DUMMY BUTTONS
        // =========================================================================
        const apply404RedirectionScript = () => {
          // Select all anchor tags
          const anchors = document.querySelectorAll("a");
          anchors.forEach((a) => {
            const href = a.getAttribute("href");

            // Check if link is dummy, empty, or '#' (excluding toggle classes / components if any)
            if (
              !href ||
              href === "#" ||
              href.trim() === "" ||
              href.toLowerCase() === "javascript:void(0)"
            ) {
              // Check if it has class indicating javascript action (like trigger tabs)
              if (
                a.classList.contains("tracking-tab-trigger") ||
                a.classList.contains("nav-menu-link")
              ) {
                return; // Let javascript handlers work
              }
              a.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                window.location.href = "../404.html";
              });
            }
          });

          // Select all buttons on the dashboard (excluding layout toggle, logout, password show/hide, save settings)
          const buttons = document.querySelectorAll("button");
          buttons.forEach((btn) => {
            // Exclude operational dashboard buttons
            if (
              btn.id === "mobile-sidebar-toggle-btn" ||
              btn.id === "dashboard-logout-btn" ||
              btn.id === "profile-pass-toggle" ||
              btn.id === "btn-save-profile" ||
              btn.id === "btn-save-cosmetic"
            ) {
              return;
            }
            btn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              window.location.href = "../404.html";
            });
          });
        };

        // Run redirection hook
        apply404RedirectionScript();
      });
    </script>
