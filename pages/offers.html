<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offers & Discounts - Stackly Grocery</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/webp"
      href="../assets/images/stackly-logo.webp"
    />
    <!-- Main CSS (relative path from pages/ directory) -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <!-- JavaScript Component Loader -->
    <script src="../assets/js/script.js" defer></script>
  </head>
  <body style="display: flex; flex-direction: column; min-height: 100vh">
    <!-- Reusable Custom Header -->
    <custom-header></custom-header>

    <!-- Page Content -->
    <main
      style="
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 24px;
        flex-grow: 1;
        width: 100%;
      "
    >
      <div
        style="
          background-color: var(--bg-white);
          border-radius: 12px;
          padding: 40px;
          border: 1px solid var(--border-color);
          box-shadow: var(--shadow-sm);
        "
      >
        <h1
          style="
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 16px;
          "
        >
          Super Offers & Bargains
        </h1>
        <p style="color: var(--text-medium); font-size: 15px; line-height: 1.6">
          Grab exclusive weekly discounts, coupon codes, and buy-one-get-one
          offers on our premium stocks.
        </p>
      </div>
    </main>

    <!-- Newsletter Section -->
    <section class="footer-features-newsletter-section">
      <!-- Newsletter Subscription Banner -->
      <div class="container">
        <div class="newsletter-banner-card">
          <div class="row align-items-center">
            <div class="col-lg-7 col-md-8 position-relative z-3">
              <h3 class="newsletter-title">Subscribe to our Newsletter</h3>
              <p class="newsletter-subtitle">
                Get the best offers & updates straight to your inbox.
              </p>
              <form
                class="newsletter-form d-flex gap-2"
                id="home-newsletter-form"
              >
                <input
                  type="email"
                  class="form-control newsletter-input"
                  placeholder="Enter your email address"
                  required
                />
                <button type="submit" class="btn btn-subscribe">
                  Subscribe
                </button>
              </form>
              <div class="newsletter-success-msg" id="newsletter-success-msg">
                <i class="fa-solid fa-circle-check"></i> Thank you for
                subscribing! Check your inbox for exclusive updates.
              </div>
            </div>
          </div>
          <!-- Newsletter Visuals (Right aligned, overlapping) -->
          <div class="newsletter-visuals-container">
            <img
              src="../assets/images/home/leaves.webp"
              alt="Floating Leaves background"
              class="newsletter-leaves-bg"
            />
            <img
              src="../assets/images/newsletter-image.webp"
              alt="Fresh Groceries Bag"
              class="newsletter-bag-img"
            />
          </div>
        </div>
      </div>
    </section>

    <!-- Reusable Custom Footer -->
    <custom-footer></custom-footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
